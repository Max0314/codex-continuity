name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Test Go
        run: go test ./...

      - name: Build web
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build release binaries
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/continuity-windows-amd64.exe ./cmd/continuity-client
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release/continuity-server-linux-amd64 ./cmd/continuity-server

      - name: Validate Compose and image
        env:
          CONTINUITY_ADMIN_PASSWORD: ci-only-password
        run: |
          docker compose config --quiet
          docker build -t codex-continuity:ci .
