name: codex-continuity

services:
  continuity:
    build:
      context: .
      dockerfile: Dockerfile.runtime
    image: codex-continuity:0.3.1-fribench
    container_name: codex-continuity
    restart: unless-stopped
    init: true
    user: "1003:1003"
    ports:
      - "127.0.0.1:24001:8080"
    env_file:
      - /srv/fribench/apps/internal/codex-continuity/shared/.env
    environment:
      CONTINUITY_ADDR: ":8080"
      CONTINUITY_DATA_DIR: "/data"
      CONTINUITY_WEB_DIR: "/app/web"
      CONTINUITY_DOWNLOAD_DIR: "/downloads"
      CONTINUITY_MAX_UPLOAD_MIB: "500"
    volumes:
      - /srv/fribench/apps/internal/codex-continuity/shared/data:/data
      - /srv/fribench/apps/internal/codex-continuity/shared/downloads:/downloads:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
