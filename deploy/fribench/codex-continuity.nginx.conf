# managed-by-codex-continuity-temporary-public
# Temporary direct HTTP ingress. The control script removes this site after 48 hours.

upstream codex_continuity_backend {
    server 127.0.0.1:24001;
    keepalive 16;
}

server {
    listen 10.6.0.9:24001;
    server_name _;

    client_max_body_size 512m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://codex_continuity_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 8s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    location = /api/v1/health {
        proxy_pass http://codex_continuity_backend;
        access_log off;
    }
}
